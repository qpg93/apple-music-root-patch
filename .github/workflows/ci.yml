name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  patch-logic:
    name: Patch-tool unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-tests for tools/patch_dex.py (synthetic fixtures)
        run: python3 tools/test_patch_dex.py

      - name: Shell syntax check
        run: bash -n tools/build_patched_apk.sh

      - name: Python syntax check
        run: python3 -m py_compile tools/*.py
